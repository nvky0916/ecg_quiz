<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>症例エディタ｜心電図 系統的判読ドリル</title>

<!-- ===================================================================
     症例エディタ
     ボタンを押して判読の答えを選ぶと、cases.js に貼り付ける文章ができる。
     選択肢は steps.js から読み込むので、クイズとまったく同じ文字になる。
     =================================================================== -->
<style>
  /* 色の名前。index.html と同じにしてある */
  :root {
    --bg: #f4f5f4; --card: #fff; --fg: #1d2624; --muted: #66716e; --line: #d9dedc;
    --accent: #0e6b66; --ok: #1f8a4c; --ok-bg: #e3f4ea; --ng: #c23a3a; --ng-bg: #fbe7e7;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif; line-height: 1.6; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 16px; display: grid; gap: 14px; }
  h1 { font-size: 22px; margin: 0; }
  h2 { font-size: 18px; margin: 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 10px; }
  .muted { color: var(--muted); font-size: 14px; margin: 0; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  label { font-weight: bold; font-size: 14px; }

  button { font: inherit; cursor: pointer; border-radius: 8px; padding: 8px 14px;
           border: 1px solid var(--line); background: #fff; color: var(--fg); }
  button.main { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: bold; padding: 12px 20px; }
  button[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.small { padding: 4px 10px; font-size: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .leads { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
  .leads button { padding: 6px 0; font-size: 14px; }
  .part { display: grid; gap: 6px; padding: 10px; border-radius: 8px; background: var(--bg); }
  .part.missing { outline: 2px solid var(--ng); }   /* 未入力の小項目を赤枠で示す */

  input[type=text], input[type=number], textarea, select {
    font: inherit; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: #fff; color: var(--fg);
  }
  input[type=text], textarea, select { width: 100%; }
  input[type=number] { width: 120px; }
  textarea { min-height: 80px; }
  textarea.code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; min-height: 260px; white-space: pre; }

  .preview { border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; background: var(--bg); min-height: 60px; }
  .preview img { display: block; width: 100%; }
  .msg { padding: 10px 12px; border-radius: 8px; }
  .msg.ok { background: var(--ok-bg); } .msg.ng { background: var(--ng-bg); }
  .list { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .list li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 10px; background: var(--bg); border-radius: 8px; }
  .steps-nav { position: sticky; top: 0; z-index: 2; background: var(--bg); padding-block: 6px; }
  /* 項目へ飛ぶボタンは1行にして、はみ出したら横にスクロール（スマホで画面を占領しないように） */
  .steps-nav .chips { flex-wrap: nowrap; overflow-x: auto; }
  .steps-nav .chips button { padding: 4px 10px; font-size: 13px; white-space: nowrap; flex: none; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<!-- 選択肢（steps.js）と、今ある症例（cases.js）を読み込む -->
<script src="steps.js"></script>
<script src="cases.js"></script>

<script>
// =====================================================================
//  症例エディタのしくみ
//  1. 画面の上から、症例名・画像・判読の答えを入力する
//  2. 「リストに追加」を押すと、下の「できあがった文章」に足される
//  3. 「コピー」して、GitHub の cases.js の最後の「];」の手前に貼り付ける
// =====================================================================

const app = document.getElementById("app");

// steps.js が読み込めていなければ、案内を出してここで止める
if (typeof STEPS === "undefined") {
  app.textContent = "steps.js を読み込めませんでした。editor.html と同じ場所に steps.js があるか、書き間違いがないか確認してください。";
  throw new Error("steps.js が読み込めていません");
}

const STORE_KEY = "ecg-editor-list";   // 作った症例を、このブラウザに一時保存するときの名前

let form = {};       // 入力中の答え。{ sinus: "洞調律", hr: 60, ... }
let list = [];       // 「リストに追加」した症例の一覧
let refreshers = []; // 入力欄の表示を、form の中身に合わせて更新する関数の一覧

// 部品を作る関数（index.html と同じもの）
function el(tag, props = {}, ...children) {
  const e = document.createElement(tag);
  Object.assign(e, props);
  for (const c of children.flat()) if (c != null) e.append(c);
  return e;
}

// ---------------------------------------------------------------------
//  このブラウザへの一時保存（ページを閉じても、作りかけのリストが残る）
//  try { } catch { } は「失敗してもエラーで止まらないようにする」書き方
// ---------------------------------------------------------------------
function loadList() {
  try { list = JSON.parse(localStorage.getItem(STORE_KEY)) || []; } catch { list = []; }
}
function saveList() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(list)); } catch {}
}

// ---------------------------------------------------------------------
//  入力欄をからっぽにする / 正常の答えで埋める
// ---------------------------------------------------------------------
const allParts = STEPS.flatMap(s => s.parts);   // 全部の小項目を1列に並べたもの

function emptyForm() {
  const f = { title: "", image: "", diagnosisText: "", comment: "" };
  for (const p of allParts) {
    if (p.type === "number") f[p.key] = null;
    else if (p.type === "single") f[p.key] = null;
    else if (p.type === "text") {}                 // 診断は diagnosisText に書く
    else f[p.key] = [];                            // multi と leads は空の配列
  }
  return f;
}

// 正常で埋める：1つ選ぶ項目は最初の選択肢、複数選ぶ項目は「なし」、誘導は何も選ばない
function fillNormal() {
  for (const p of allParts) {
    if (p.type === "single") form[p.key] = p.options[0];
    if (p.type === "multi") form[p.key] = p.options.includes("なし") ? ["なし"] : [];
    if (p.type === "leads") form[p.key] = [];
  }
  refreshAll();
}

function refreshAll() { refreshers.forEach(f => f()); }

// ---------------------------------------------------------------------
//  小項目の入力欄を作る（クイズとほぼ同じだが、あとから中身を変えられるようにしてある）
// ---------------------------------------------------------------------
function makeInput(part) {
  const box = el("div", { className: "part", id: "part-" + part.key });
  box.append(el("b", {}, part.label));

  if (part.type === "number") {
    const input = el("input", { type: "number", min: 0, max: 300, inputMode: "numeric",
      oninput: () => { form[part.key] = input.value === "" ? null : Number(input.value); box.classList.remove("missing"); } });
    box.append(el("div", {}, input, " " + (part.unit || "")));
    refreshers.push(() => input.value = form[part.key] ?? "");
  }

  else if (part.type === "text") {
    // 診断は、正解として認める答えを1行に1つずつ書く
    const ta = el("textarea", { placeholder: "1行に1つずつ書く\n例：急性下壁梗塞\n下壁梗塞",
      oninput: () => { form.diagnosisText = ta.value; box.classList.remove("missing"); } });
    box.append(el("small", { className: "muted" }, "正解として認める答えを、1行に1つずつ"), ta);
    refreshers.push(() => ta.value = form.diagnosisText);
  }

  else if (part.type === "single" || part.type === "multi") {
    const buttons = part.options.map(opt => {
      const b = el("button", { textContent: opt, type: "button" });
      b.onclick = () => {
        if (part.type === "single") {
          form[part.key] = form[part.key] === opt ? null : opt;   // もう一度押すと選択を外す
        } else {
          let a = form[part.key];
          if (opt === "なし") a = a.includes("なし") ? [] : ["なし"];
          else a = (a.includes(opt) ? a.filter(x => x !== opt) : [...a, opt]).filter(x => x !== "なし");
          form[part.key] = a;
        }
        box.classList.remove("missing");
        paint();
      };
      return b;
    });
    // 選ばれているボタンだけ緑にする
    const paint = () => {
      const now = [].concat(form[part.key] ?? []);
      buttons.forEach(x => x.setAttribute("aria-pressed", now.includes(x.textContent)));
    };
    box.append(el("div", { className: "chips" }, buttons));
    refreshers.push(paint);
  }

  else if (part.type === "leads") {
    box.firstChild.append(el("small", { className: "muted" }, "　所見のある誘導（なければ選ばない）"));
    const buttons = LEADS.map(ld => {
      const b = el("button", { textContent: ld, type: "button" });
      b.onclick = () => {
        const a = form[part.key];
        form[part.key] = a.includes(ld) ? a.filter(x => x !== ld) : [...a, ld];
        paint();
      };
      return b;
    });
    const paint = () => buttons.forEach(x => x.setAttribute("aria-pressed", form[part.key].includes(x.textContent)));
    box.append(el("div", { className: "leads" }, buttons));
    refreshers.push(paint);
  }
  return box;
}

// ---------------------------------------------------------------------
//  入力のチェック：足りないところを一覧にして返す
// ---------------------------------------------------------------------
function checkForm() {
  const problems = [];
  document.querySelectorAll(".part.missing").forEach(x => x.classList.remove("missing"));
  if (!form.title.trim()) problems.push("症例名");
  if (!form.image.trim()) problems.push("画像のファイル名");
  for (const p of allParts) {
    const v = p.type === "text" ? form.diagnosisText.trim() : form[p.key];
    const empty = p.type === "leads" ? false                       // 誘導は「なし」もありうるので空でOK
               : Array.isArray(v) ? v.length === 0
               : v == null || v === "";
    if (empty) {
      problems.push(p.label);
      document.getElementById("part-" + p.key)?.classList.add("missing");
    }
  }
  return problems;
}

// ---------------------------------------------------------------------
//  入力した内容を、cases.js に貼れる形の文章にする
//  JSON.stringify は、値を「"文字"」や「["a", "b"]」の形の文章に変える命令
// ---------------------------------------------------------------------
function toCase(f) {
  const answers = {};
  for (const p of allParts) {
    if (p.type === "text") {
      answers[p.key] = f.diagnosisText.split("\n").map(x => x.trim()).filter(x => x);
    } else if (p.type === "leads") {
      answers[p.key] = LEADS.filter(l => f[p.key].includes(l));   // I, II, III… の順に並べ直す
    } else {
      answers[p.key] = f[p.key];
    }
  }
  return { title: f.title.trim(), image: "images/" + f.image.trim(), answers, comment: f.comment.trim() };
}

function caseToText(c) {
  const j = v => JSON.stringify(v).replace(/","/g, '", "');   // 見やすいように「,」のあとに空白を入れる
  const lines = [];
  lines.push("  {");
  lines.push(`    title: ${j(c.title)},`);
  lines.push(`    image: ${j(c.image)},`);
  lines.push("    answers: {");
  // 項目ごとに1行にまとめる（cases.js の今の書き方と同じ並び）
  for (const s of STEPS) {
    lines.push("      " + s.parts.map(p => `${p.key}: ${j(c.answers[p.key])},`).join(" "));
  }
  lines.push("    },");
  lines.push(`    comment: ${j(c.comment)}`);
  lines.push("  },");
  return lines.join("\n");
}

// cases.js の症例を、入力欄に読み込む（直したいとき用）
function loadCase(c) {
  form = emptyForm();
  form.title = c.title;
  form.image = c.image.replace(/^images\//, "");
  form.comment = c.comment || "";
  for (const p of allParts) {
    const v = c.answers?.[p.key];
    if (v === undefined) continue;
    if (p.type === "text") form.diagnosisText = [].concat(v).join("\n");
    else form[p.key] = Array.isArray(v) ? [...v] : v;
  }
  refreshAll();
  titleInput.value = form.title;
  imageInput.value = form.image;
  commentInput.value = form.comment;
  showPreview();
}

// ---------------------------------------------------------------------
//  画像のプレビュー
//  GitHub に上げた images/〇〇.png が表示されれば、ファイル名が合っている
// ---------------------------------------------------------------------
const previewBox = el("div", { className: "preview" });
const previewMsg = el("p", { className: "muted" });
function showPreview(fileUrl) {
  const name = form.image.trim();
  if (!fileUrl && !name) { previewBox.replaceChildren(); previewMsg.textContent = "ファイル名を入れると、ここに画像が出ます"; return; }
  const img = el("img", { alt: "心電図のプレビュー" });
  img.onload = () => previewMsg.textContent = fileUrl ? "手元の画像を表示しています（ファイル名の確認にはなりません）" : "images/" + name + " が見つかりました";
  img.onerror = () => { previewBox.replaceChildren(); previewMsg.textContent = "images/" + name + " が見つかりません。GitHub に上げたか、ファイル名（大文字・小文字も）を確認してください"; };
  img.src = fileUrl || "images/" + name;
  previewBox.replaceChildren(img);
}

// =====================================================================
//  画面を組み立てる
// =====================================================================
loadList();
form = emptyForm();

const titleInput = el("input", { type: "text", id: "title", placeholder: "例：急性下壁梗塞1",
  oninput: () => form.title = titleInput.value });
const imageInput = el("input", { type: "text", id: "image", placeholder: "例：inferior-mi1.png",
  oninput: () => { form.image = imageInput.value; showPreview(); } });
const localFile = el("input", { type: "file", accept: "image/*", id: "localfile",
  onchange: () => {
    const f = localFile.files[0];
    if (!f) return;
    if (!form.image) { form.image = f.name; imageInput.value = f.name; }   // ファイル名も入れておく
    showPreview(URL.createObjectURL(f));
  } });
const commentInput = el("textarea", { id: "comment", placeholder: "例：II・III・aVFでST上昇、I・aVLで鏡像変化のST低下。",
  oninput: () => form.comment = commentInput.value });

// 既存の症例を読み込むプルダウン
const loadSelect = el("select", { id: "load" },
  el("option", { value: "" }, "（cases.js の症例を読み込んで直す）"),
  (typeof CASES === "undefined" ? [] : CASES).map((c, i) => el("option", { value: i }, c.title)));
loadSelect.onchange = () => { if (loadSelect.value !== "") loadCase(CASES[loadSelect.value]); };

// 判読の項目（STEPS の数だけカードを作る）
const stepCards = STEPS.map((s, i) => el("div", { className: "card", id: "step-" + i },
  el("h2", {}, (i + 1) + ". " + s.name),
  s.parts.map(makeInput)));

// 項目へ飛ぶボタン（長いページを移動しやすくする）
const nav = el("div", { className: "steps-nav" }, el("div", { className: "chips" },
  STEPS.map((s, i) => el("button", { type: "button", onclick: () => document.getElementById("step-" + i).scrollIntoView({ behavior: "smooth" }) }, (i + 1) + "." + s.name))));

// できあがった文章と、症例のリスト
const output = el("textarea", { className: "code", id: "output", readOnly: true });
const listBox = el("ul", { className: "list" });
const message = el("div");

function renderList() {
  listBox.replaceChildren(...(list.length ? list.map((c, i) => el("li", {},
    el("span", {}, c.title + "（" + c.image + "）"),
    el("div", { className: "row" },
      el("button", { className: "small", type: "button", onclick: () => { loadCase(c); window.scrollTo({ top: 0, behavior: "smooth" }); } }, "読み込む"),
      el("button", { className: "small", type: "button", onclick: () => { list.splice(i, 1); saveList(); renderList(); } }, "消す")))) :
    [el("li", {}, el("span", { className: "muted" }, "まだありません"))]));
  output.value = list.map(caseToText).join("\n");
}

function addToList() {
  const problems = checkForm();
  if (problems.length) {
    message.replaceChildren(el("div", { className: "msg ng" }, "まだ選んでいない項目があります：" + problems.join("、")));
    return;
  }
  const c = toCase(form);
  const same = list.findIndex(x => x.title === c.title);   // 同じ名前があれば置き換える
  if (same >= 0) list[same] = c; else list.push(c);
  saveList();
  renderList();
  message.replaceChildren(el("div", { className: "msg ok" }, "「" + c.title + "」をリストに追加しました。下の文章をコピーして cases.js に貼り付けてください"));
}

function copyOutput() {
  // コピーできないブラウザでは、文章を選んだ状態にして、手でコピーしてもらう
  navigator.clipboard?.writeText(output.value)
    .then(() => message.replaceChildren(el("div", { className: "msg ok" }, "コピーしました")))
    .catch(() => { output.select(); message.replaceChildren(el("div", { className: "msg ng" }, "自動でコピーできませんでした。選ばれている文章を手でコピーしてください")); });
}

function newCase() {
  form = emptyForm();
  refreshAll();
  titleInput.value = imageInput.value = commentInput.value = "";
  loadSelect.value = "";
  showPreview();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

app.append(
  el("div", { className: "bar" },
    el("h1", {}, "症例エディタ"),
    el("a", { href: "index.html" }, "クイズに戻る")),
  el("p", { className: "muted" }, "ボタンで答えを選ぶと、cases.js に貼り付ける文章ができます。選択肢はクイズと同じ steps.js から読み込んでいます。"),

  el("div", { className: "card" },
    el("h2", {}, "症例の情報"),
    loadSelect,
    el("label", { htmlFor: "title" }, "症例名"), titleInput,
    el("label", { htmlFor: "image" }, "画像のファイル名（images フォルダの中の名前）"), imageInput,
    el("div", { className: "row" }, el("span", { className: "muted" }, "手元の画像で確認："), localFile),
    previewMsg, previewBox),

  el("div", { className: "card" },
    el("div", { className: "bar" },
      el("p", { className: "muted" }, "ほとんどが正常なら、先に「正常で埋める」を押してから、異常なところだけ直すと速いです"),
      el("button", { type: "button", onclick: fillNormal }, "正常で埋める"))),

  nav,
  ...stepCards,   // ... は「配列の中身をばらして並べる」という書き方

  el("div", { className: "card" },
    el("h2", {}, "解説（結果画面に出る）"),
    commentInput),

  el("div", { className: "card" },
    el("div", { className: "row" },
      el("button", { className: "main", type: "button", onclick: addToList }, "リストに追加"),
      el("button", { type: "button", onclick: newCase }, "新しい症例")),
    message),

  el("div", { className: "card" },
    el("h2", {}, "作った症例"),
    el("p", { className: "muted" }, "このブラウザに一時保存されています。cases.js に貼り付け終わったら「全部消す」で空にしてください。"),
    listBox,
    el("h2", {}, "できあがった文章"),
    el("p", { className: "muted" }, "GitHub で cases.js を開いて鉛筆マークで編集し、いちばん下の「];」のすぐ上に貼り付けます。読み込んで直した症例は、cases.js の同じ症例のかたまりと置き換えてください。"),
    output,
    el("div", { className: "row" },
      el("button", { className: "main", type: "button", onclick: copyOutput }, "コピー"),
      el("button", { type: "button", onclick: () => { list = []; saveList(); renderList(); } }, "全部消す"))));

renderList();
showPreview();

</script>
</body>
</html>
